name: 03 Cross Encoder Bi Encoder Ranking System CI

on:
  push:
    branches:
      - main
    paths:
      - "03-cross-encoder-bi-encoder-ranking-system/**"
      - ".github/workflows/03-cross-encoder-bi-encoder-ranking-system.yml"

  pull_request:
    paths:
      - "03-cross-encoder-bi-encoder-ranking-system/**"
      - ".github/workflows/03-cross-encoder-bi-encoder-ranking-system.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-03-static-space-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 03-cross-encoder-bi-encoder-ranking-system

jobs:
  test:
    name: Test Project 03
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            03-cross-encoder-bi-encoder-ranking-system/requirements.txt
            03-cross-encoder-bi-encoder-ranking-system/requirements-dev.txt
            03-cross-encoder-bi-encoder-ranking-system/requirements-benchmark.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install lightweight Python CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyyaml pytest gradio

      - name: Validate browser project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: python scripts/validate_web_project.py

      - name: Install browser dependencies
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm install

      - name: Check browser JavaScript
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm run check

      - name: Run browser metric tests
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm test

      - name: Build Hugging Face Static Space
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm run build

      - name: Validate deployable Static Space
        working-directory: ${{ env.PROJECT_DIR }}
        run: python scripts/validate_dist.py

      - name: Compile Python files
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m compileall app.py gradio_app.py src scripts tests

      - name: Validate Python application imports
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -c "import app; print('Gradio app import passed')"
          python -c "from src.inference_pipeline import get_engine; print('Inference import passed')"
          python -c "from src.retrieval_pipeline import RetrievalPipeline; print('Retrieval import passed')"
          python -c "from src.reranking_pipeline import RerankingPipeline; print('Reranking import passed')"

      - name: Run Python tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -q

  deploy-static-space:
    name: Deploy Project 03 Static Space
    needs: test

    # Allows deployment from:
    # 1. A push to main
    # 2. A manual workflow run on main
    # Pull requests will not deploy.
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.HF_SPACE_ID != ''

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Hugging Face deployment configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN repository secret is missing."
            exit 1
          fi

          if [ -z "$HF_SPACE_ID" ]; then
            echo "HF_SPACE_ID repository variable is missing."
            exit 1
          fi

          echo "Target Hugging Face Space: $HF_SPACE_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install browser dependencies
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm install

      - name: Build production Static Space
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=0.28,<2"

      - name: Validate generated Static Space
        working-directory: ${{ env.PROJECT_DIR }}
        run: python scripts/validate_dist.py

      - name: Upload Vite build to Hugging Face Static Space
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: python scripts/deploy_static_space.py

      - name: Display deployed Space URL
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          echo "Project 03 deployed successfully."
          echo "Space URL: https://huggingface.co/spaces/$HF_SPACE_ID"