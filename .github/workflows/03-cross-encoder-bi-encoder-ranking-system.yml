name: 03 Cross Encoder Bi Encoder Ranking System CI

on:
  push:
    branches:
      - main
    paths:
      - "03-cross-encoder-bi-encoder-ranking-system/**"
      - ".github/workflows/03-cross-encoder-bi-encoder-ranking-system.yml"

  pull_request:
    paths:
      - "03-cross-encoder-bi-encoder-ranking-system/**"
      - ".github/workflows/03-cross-encoder-bi-encoder-ranking-system.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-03-static-space-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 03-cross-encoder-bi-encoder-ranking-system

jobs:
  test:
    name: Test Project 03
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            03-cross-encoder-bi-encoder-ranking-system/requirements.txt
            03-cross-encoder-bi-encoder-ranking-system/requirements-dev.txt
            03-cross-encoder-bi-encoder-ranking-system/requirements-benchmark.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install lightweight Python CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyyaml pytest gradio

      - name: Validate Hugging Face Space metadata
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("web/public/README.md")

          if not readme.exists():
              raise SystemExit(
                  "Missing Hugging Face metadata file: "
                  "web/public/README.md"
              )

          lines = readme.read_text(encoding="utf-8").splitlines()

          short_description = None
          for line in lines:
              if line.startswith("short_description:"):
                  short_description = line.split(":", 1)[1].strip()
                  break

          if not short_description:
              raise SystemExit(
                  "short_description is missing from "
                  "web/public/README.md"
              )

          description_length = len(short_description)

          print("Short description:", short_description)
          print("Character count:", description_length)

          if description_length > 60:
              raise SystemExit(
                  "Hugging Face short_description must contain "
                  "60 characters or fewer."
              )

          print("Hugging Face metadata validation passed.")
          PY

      - name: Validate browser project structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: python scripts/validate_web_project.py

      - name: Install browser dependencies
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm install

      - name: Check browser JavaScript
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm run check

      - name: Run browser metric tests
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm test

      - name: Build Hugging Face Static Space
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm run build

      - name: Validate deployable Static Space
        working-directory: ${{ env.PROJECT_DIR }}
        run: python scripts/validate_dist.py

      - name: Validate built Space metadata
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("web/dist/README.md")

          if not readme.exists():
              raise SystemExit(
                  "Vite build did not generate web/dist/README.md"
              )

          lines = readme.read_text(encoding="utf-8").splitlines()

          short_description = None
          for line in lines:
              if line.startswith("short_description:"):
                  short_description = line.split(":", 1)[1].strip()
                  break

          if not short_description:
              raise SystemExit(
                  "short_description is missing from the built README."
              )

          if len(short_description) > 60:
              raise SystemExit(
                  "Built short_description exceeds 60 characters."
              )

          print("Built Hugging Face metadata validation passed.")
          print("Short description:", short_description)
          print("Character count:", len(short_description))
          PY

      - name: Compile Python files
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m compileall app.py gradio_app.py src scripts tests

      - name: Validate Python application imports
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -c "import app; print('Gradio app import passed')"
          python -c "from src.inference_pipeline import get_engine; print('Inference import passed')"
          python -c "from src.retrieval_pipeline import RetrievalPipeline; print('Retrieval import passed')"
          python -c "from src.reranking_pipeline import RerankingPipeline; print('Reranking import passed')"

      - name: Run Python tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: pytest -q

  deploy-static-space:
    name: Deploy Project 03 Static Space
    needs: test

    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.HF_SPACE_ID != ''

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Hugging Face deployment configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN repository secret is missing."
            exit 1
          fi

          if [ -z "$HF_SPACE_ID" ]; then
            echo "HF_SPACE_ID repository variable is missing."
            exit 1
          fi

          echo "Target Hugging Face Space: $HF_SPACE_ID"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install browser dependencies
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm install

      - name: Build production Static Space
        working-directory: ${{ env.PROJECT_DIR }}/web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.28,<2"

      - name: Validate generated Static Space
        working-directory: ${{ env.PROJECT_DIR }}
        run: python scripts/validate_dist.py

      - name: Validate final Hugging Face metadata
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("web/dist/README.md")

          if not readme.exists():
              raise SystemExit(
                  "Missing web/dist/README.md in deployment build."
              )

          lines = readme.read_text(encoding="utf-8").splitlines()

          short_description = None
          for line in lines:
              if line.startswith("short_description:"):
                  short_description = line.split(":", 1)[1].strip()
                  break

          if not short_description:
              raise SystemExit(
                  "short_description is missing from deployment README."
              )

          if len(short_description) > 60:
              raise SystemExit(
                  "Hugging Face short_description exceeds 60 characters."
              )

          print("Final metadata validation passed.")
          print("Short description:", short_description)
          print("Character count:", len(short_description))
          PY

      - name: Upload Vite build to Hugging Face Static Space
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: python scripts/deploy_static_space.py

      - name: Display deployed Space URL
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          echo "Project 03 deployed successfully."
          echo "Space URL: https://huggingface.co/spaces/$HF_SPACE_ID"