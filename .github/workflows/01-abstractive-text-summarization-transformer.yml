name: 01 Abstractive Text Summarization Transformer CI

on:
  push:
    branches:
      - main
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-01-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 01-abstractive-text-summarization-transformer
  WEB_DIR: 01-abstractive-text-summarization-transformer/web
  # This destination is intentionally isolated and must never use the shared
  # HF_SPACE_REPO variable that Project 06 currently uses.
  PROJECT_01_HF_SPACE_REPO: anmol-unitmole/01-abstractive-text-summarization-transformer

jobs:
  test-python:
    name: Test Python project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: 01-abstractive-text-summarization-transformer

    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SKIP_MODEL_LOAD: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            01-abstractive-text-summarization-transformer/requirements.txt
            01-abstractive-text-summarization-transformer/requirements-ci.txt

      - name: Verify dependency compatibility pins
        shell: bash
        run: |
          grep -Fx "gradio==5.49.1" requirements.txt
          grep -Fx "transformers==4.57.6" requirements.txt
          grep -Fx "huggingface-hub==0.36.2" requirements.txt
          grep -Fx "gradio==5.49.1" requirements-ci.txt
          grep -Fx "huggingface-hub==0.36.2" requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate GPU benchmark files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "requirements-training.txt"
            "configs/portfolio_experiment.yaml"
            "notebooks/complete_distilbart_training_evaluation_pipeline.ipynb"
            "src/benchmark_utils.py"
            "scripts/check_gpu.py"
            "scripts/validate_portfolio_outputs.py"
            "tests/test_benchmark_utils.py"
            "docs/GPU_FINE_TUNING_EVALUATION_GUIDE.md"
            "outputs/benchmark/latest/benchmark_manifest.json"
            "outputs/benchmark/latest/model_metrics.json"
            "outputs/benchmark/latest/PORTFOLIO_RESULTS.md"
          )
          for file in "${files[@]}"; do
            test -f "$file" || {
              echo "::error file=$file::Required Project 01 benchmark file is missing."
              exit 1
            }
          done

          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path(
              "notebooks/complete_distilbart_training_evaluation_pipeline.ipynb"
          )
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          assert notebook["nbformat"] == 4
          assert len(notebook["cells"]) >= 20

          for path in Path("outputs/benchmark/latest").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Validated {path}")

          print("Benchmark notebook and JSON files validated.")
          PY

      - name: Validate inference and Gradio imports without model downloads
        run: |
          python -c "from src.inference_pipeline import summarize_text; print('Inference import passed')"
          python -c "import app; import gradio_app; print('Gradio app import passed')"

      - name: Compile Python files
        run: python -m compileall -q app.py gradio_app.py src scripts tests

  build-static-space:
    name: Test and build Static Space
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 01-abstractive-text-summarization-transformer/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install browser application dependencies
        run: npm install --no-audit --no-fund

      - name: Run browser utility tests
        run: npm test

      - name: Build browser application on GitHub
        run: npm run build

      - name: Validate free Static Space output
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/evaluation-results.json

          grep -F "sdk: static" README.md
          grep -F "app_file: index.html" README.md
          grep -F "Xenova/distilbart-cnn-12-6" README.md

          if grep -Fq "app_build_command:" README.md; then
            echo "::error file=README.md::app_build_command would trigger a Hugging Face build. Project 01 must upload prebuilt files instead."
            exit 1
          fi

          echo "Project 01 prebuilt Static Space validation passed."

  sync-to-hugging-face:
    name: Deploy isolated Project 01 Static Space
    needs:
      - test-python
      - build-static-space
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify isolated Hugging Face destination
        shell: bash
        run: |
          set -euo pipefail
          expected="anmol-unitmole/01-abstractive-text-summarization-transformer"

          if [[ "$PROJECT_01_HF_SPACE_REPO" != "$expected" ]]; then
            echo "::error::Unsafe Hugging Face destination: $PROJECT_01_HF_SPACE_REPO"
            exit 1
          fi

          if [[ "$PROJECT_01_HF_SPACE_REPO" == *"/06-"* ]]; then
            echo "::error::Project 01 must never deploy to a Project 06 Space."
            exit 1
          fi

          echo "Deployment destination verified: $PROJECT_01_HF_SPACE_REPO"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build deployable frontend on GitHub
        working-directory: 01-abstractive-text-summarization-transformer/web
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Prepare prebuilt Hugging Face Space bundle
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _project01_hf_space
          mkdir -p _project01_hf_space

          cp -a "$WEB_DIR/dist/." _project01_hf_space/
          cp "$WEB_DIR/README.md" _project01_hf_space/README.md

          test -f _project01_hf_space/index.html
          test -f _project01_hf_space/evaluation-results.json
          test -f _project01_hf_space/README.md

          grep -F "sdk: static" _project01_hf_space/README.md
          grep -F "app_file: index.html" _project01_hf_space/README.md

          if grep -Fq "app_build_command:" _project01_hf_space/README.md; then
            echo "::error::Deployment README still contains app_build_command."
            exit 1
          fi

          if [[ -f _project01_hf_space/package.json ]]; then
            echo "::error::Unbuilt source package was copied into the deployment bundle."
            exit 1
          fi

          echo "Prebuilt Project 01 Space bundle:"
          find _project01_hf_space -maxdepth 2 -type f -print | sort

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface-hub==0.36.2"

      - name: Create or update Project 01 Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          expected_repo = (
              "anmol-unitmole/01-abstractive-text-summarization-transformer"
          )
          repo_id = os.environ["PROJECT_01_HF_SPACE_REPO"].strip()
          token = os.environ.get("HF_TOKEN", "").strip()
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          deployment_folder = Path("_project01_hf_space")

          if repo_id != expected_repo:
              raise SystemExit(
                  f"Deployment blocked. Expected {expected_repo}, received {repo_id}."
              )
          if not token:
              raise SystemExit(
                  "HF_TOKEN is missing under GitHub Settings > "
                  "Secrets and variables > Actions > Secrets."
              )

          required_files = [
              deployment_folder / "README.md",
              deployment_folder / "index.html",
              deployment_folder / "evaluation-results.json",
          ]
          missing = [str(path) for path in required_files if not path.is_file()]
          if missing:
              raise SystemExit(
                  "Missing prebuilt deployment files:\n" + "\n".join(missing)
              )

          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=str(deployment_folder),
              path_in_repo=".",
              delete_patterns="*",
              commit_message=(
                  "Deploy isolated Project 01 prebuilt Static Space "
                  f"from GitHub {sha}"
              ),
          )

          print(
              "Project 01 Static Space synchronized: "
              f"https://huggingface.co/spaces/{repo_id}"
          )
          PY
