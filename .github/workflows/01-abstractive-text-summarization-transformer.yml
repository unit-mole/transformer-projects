name: 01 Abstractive Text Summarization Transformer CI

on:
  push:
    branches:
      - main
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-01-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: 01-abstractive-text-summarization-transformer
  WEB_DIR: 01-abstractive-text-summarization-transformer/web
  PROJECT_01_HF_SPACE_REPO: anmol-unitmole/01-abstractive-text-summarization-transformer

jobs:
  test-python:
    name: Test Python project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: 01-abstractive-text-summarization-transformer

    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SKIP_MODEL_LOAD: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            01-abstractive-text-summarization-transformer/requirements.txt
            01-abstractive-text-summarization-transformer/requirements-ci.txt

      - name: Verify dependency compatibility pins
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "gradio==5.49.1" requirements.txt
          grep -Fx "transformers==4.57.6" requirements.txt
          grep -Fx "huggingface-hub==0.36.2" requirements.txt
          grep -Fx "gradio==5.49.1" requirements-ci.txt
          grep -Fx "huggingface-hub==0.36.2" requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate benchmark files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "requirements-training.txt"
            "configs/portfolio_experiment.yaml"
            "notebooks/complete_distilbart_training_evaluation_pipeline.ipynb"
            "src/benchmark_utils.py"
            "scripts/check_gpu.py"
            "scripts/validate_portfolio_outputs.py"
            "tests/test_benchmark_utils.py"
            "docs/GPU_FINE_TUNING_EVALUATION_GUIDE.md"
            "outputs/benchmark/latest/benchmark_manifest.json"
            "outputs/benchmark/latest/model_metrics.json"
            "outputs/benchmark/latest/PORTFOLIO_RESULTS.md"
          )

          for file_path in "${required_files[@]}"; do
            test -f "$file_path" || {
              echo "::error file=$file_path::Required Project 01 benchmark file is missing."
              exit 1
            }
          done

          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path(
              "notebooks/complete_distilbart_training_evaluation_pipeline.ipynb"
          )
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          assert notebook.get("nbformat") == 4
          assert len(notebook.get("cells", [])) >= 20

          for path in Path("outputs/benchmark/latest").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Validated {path}")

          print("Benchmark notebook and JSON files validated.")
          PY

      - name: Validate imports without model downloads
        run: |
          python -c "from src.inference_pipeline import summarize_text; print('Inference import passed')"
          python -c "import app; import gradio_app; print('Gradio app import passed')"

      - name: Compile Python files
        run: python -m compileall -q app.py gradio_app.py src scripts tests

  build-static-space:
    name: Test and build Static Space
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 01-abstractive-text-summarization-transformer/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install browser application dependencies
        run: npm install --no-audit --no-fund

      - name: Run browser utility tests
        run: npm test

      - name: Build browser application on GitHub
        run: npm run build

      - name: Validate generated browser files
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/evaluation-results.json

          asset_count="$(find dist -type f | wc -l | tr -d ' ')"
          if [[ "$asset_count" -lt 3 ]]; then
            echo "::error::The Vite build produced too few deployment files."
            find dist -maxdepth 3 -type f -print | sort
            exit 1
          fi

          if grep -Fq 'src="/src/' dist/index.html; then
            echo "::error file=dist/index.html::The built HTML still references Vite source files."
            exit 1
          fi

          echo "Generated browser bundle validated."
          find dist -maxdepth 3 -type f -print | sort

  deploy-project-01:
    name: Deploy isolated Project 01 Static Space
    needs:
      - test-python
      - build-static-space
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify isolated deployment destination
        shell: bash
        run: |
          set -euo pipefail

          expected="anmol-unitmole/01-abstractive-text-summarization-transformer"

          if [[ "$PROJECT_01_HF_SPACE_REPO" != "$expected" ]]; then
            echo "::error::Deployment blocked. Expected $expected but received $PROJECT_01_HF_SPACE_REPO."
            exit 1
          fi

          if [[ "$PROJECT_01_HF_SPACE_REPO" == *"/06-"* ]]; then
            echo "::error::Project 01 must never deploy to the Project 06 Space."
            exit 1
          fi

          echo "Safe Project 01 destination: $PROJECT_01_HF_SPACE_REPO"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build deployment bundle on GitHub
        working-directory: 01-abstractive-text-summarization-transformer/web
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Prepare prebuilt Hugging Face Space
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _project01_hf_space
          mkdir -p _project01_hf_space

          cp -a "$WEB_DIR/dist/." _project01_hf_space/

          cat > _project01_hf_space/README.md <<'SPACE_README'
          ---
          title: Abstractive Text Summarization Transformer
          emoji: 📝
          colorFrom: blue
          colorTo: purple
          sdk: static
          app_file: index.html
          pinned: false
          license: mit
          models:
            - Xenova/distilbart-cnn-12-6
          short_description: Browser-based DistilBART text summarization
          ---

          # Abstractive Text Summarization Transformer

          Real browser-based Transformer summarization using Transformers.js,
          ONNX Runtime Web, and `Xenova/distilbart-cnn-12-6`.

          The frontend is prebuilt by GitHub Actions. Hugging Face directly
          serves `index.html`; no paid Static Space build job is requested.

          Source: https://github.com/unit-mole/transformer-projects/tree/main/01-abstractive-text-summarization-transformer
          SPACE_README

          python - <<'PY'
          from pathlib import Path

          root = Path("_project01_hf_space")
          required = [
              root / "README.md",
              root / "index.html",
              root / "evaluation-results.json",
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit("Missing or empty deployment files:\n" + "\n".join(missing))

          readme = (root / "README.md").read_text(encoding="utf-8")
          required_metadata = [
              "sdk: static",
              "app_file: index.html",
              "short_description: Browser-based DistilBART text summarization",
          ]
          for value in required_metadata:
              if value not in readme:
                  raise SystemExit(f"Missing README metadata: {value}")

          if "app_build_command:" in readme:
              raise SystemExit("README must not contain app_build_command.")

          if "dist/index.html" in readme:
              raise SystemExit("README must point to root index.html, not dist/index.html.")

          short_description = "Browser-based DistilBART text summarization"
          if len(short_description) > 60:
              raise SystemExit("short_description exceeds 60 characters.")

          if (root / "package.json").exists():
              raise SystemExit("Unbuilt source package was copied to the Space bundle.")

          print("Prebuilt free Static Space bundle validated.")
          PY

          echo "Deployment bundle:"
          find _project01_hf_space -maxdepth 3 -type f -print | sort

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade "huggingface-hub>=0.36.2,<2.0"

      - name: Create or update Project 01 Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from huggingface_hub import HfApi

          expected_repo = (
              "anmol-unitmole/01-abstractive-text-summarization-transformer"
          )
          repo_id = os.environ["PROJECT_01_HF_SPACE_REPO"].strip()
          token = os.environ.get("HF_TOKEN", "").strip()
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          deployment_folder = Path("_project01_hf_space")

          if repo_id != expected_repo:
              raise SystemExit(
                  f"Deployment blocked. Expected {expected_repo}, received {repo_id}."
              )

          if not token:
              raise SystemExit(
                  "HF_TOKEN is missing under GitHub Settings > "
                  "Secrets and variables > Actions > Secrets."
              )

          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )

          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=str(deployment_folder),
              path_in_repo=".",
              delete_patterns=["*", "**/*"],
              commit_message=(
                  "Deploy isolated Project 01 prebuilt Static Space "
                  f"from GitHub {sha}"
              ),
          )

          print(
              "Project 01 deployed successfully: "
              f"https://huggingface.co/spaces/{repo_id}"
          )
          PY
