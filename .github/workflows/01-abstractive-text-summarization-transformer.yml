name: 01 Abstractive Text Summarization Transformer CI

on:
  push:
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  pull_request:
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-abstractive-text-summarization-transformer
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SKIP_MODEL_LOAD: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            01-abstractive-text-summarization-transformer/requirements.txt
            01-abstractive-text-summarization-transformer/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app.py gradio_app.py src scripts tests

      - name: Run tests without downloading models
        run: pytest -q

      - name: Validate app and inference imports
        run: |
          python -c "import app; import gradio_app; from src.inference_pipeline import summarize_text; print('Import validation passed')"
