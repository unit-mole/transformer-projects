name: 01 Abstractive Text Summarization Transformer CI

on:
  push:
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  pull_request:
    paths:
      - "01-abstractive-text-summarization-transformer/**"
      - ".github/workflows/01-abstractive-text-summarization-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Test Python project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: 01-abstractive-text-summarization-transformer

    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SKIP_MODEL_LOAD: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            01-abstractive-text-summarization-transformer/requirements.txt
            01-abstractive-text-summarization-transformer/requirements-ci.txt

      - name: Verify dependency compatibility pins
        shell: bash
        run: |
          grep -Fx "gradio==5.49.1" requirements.txt
          grep -Fx "transformers==4.57.6" requirements.txt
          grep -Fx "huggingface-hub==0.36.2" requirements.txt
          grep -Fx "gradio==5.49.1" requirements-ci.txt
          grep -Fx "huggingface-hub==0.36.2" requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate inference and Gradio imports without model downloads
        run: |
          python -c "from src.inference_pipeline import summarize_text; print('Inference import passed')"
          python -c "import app; import gradio_app; print('Gradio app import passed')"

      - name: Compile Python files
        run: python -m compileall -q app.py gradio_app.py src scripts tests

  build-static-space:
    name: Test and build Static Space
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 01-abstractive-text-summarization-transformer/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install browser application dependencies
        run: npm install --no-audit --no-fund

      - name: Run browser utility tests
        run: npm test

      - name: Build Hugging Face Static Space
        run: npm run build

      - name: Validate Static Space output
        shell: bash
        run: |
          test -f dist/index.html
          grep -F "sdk: static" README.md
          grep -F "app_build_command: npm run build" README.md
          grep -F "app_file: dist/index.html" README.md
          grep -F "Xenova/distilbart-cnn-12-6" README.md

  sync-to-hugging-face:
    name: Sync Static Space to Hugging Face
    needs: [test-python, build-static-space]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.HF_SPACE_REPO != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface-hub==0.36.2"

      - name: Create or update free Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "").strip()
          repo_id = os.environ.get("HF_SPACE_REPO", "").strip()
          sha = os.environ.get("GITHUB_SHA", "")[:7]

          if not token:
              raise SystemExit("HF_TOKEN is missing. Add it under GitHub Settings > Secrets and variables > Actions > Secrets.")
          if "/" not in repo_id:
              raise SystemExit("HF_SPACE_REPO must use owner/space-name format.")

          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="static",
              private=False,
              exist_ok=True,
          )
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="01-abstractive-text-summarization-transformer/web",
              path_in_repo=".",
              ignore_patterns=["node_modules/**", "dist/**", ".vite/**", "*.log"],
              delete_patterns="*",
              commit_message=f"Deploy Project 01 Static Space from GitHub {sha}",
          )
          print(f"Static Space synchronized: https://huggingface.co/spaces/{repo_id}")
          PY
