name: 07 Document Semantic Search Sentence BERT CI

on:
  push:
    branches:
      - main
    paths:
      - "07-document-semantic-search-sentence-bert/**"
      - "docs/07-document-semantic-search-sentence-bert/**"
      - ".github/workflows/07-document-semantic-search-sentence-bert.yml"

  pull_request:
    branches:
      - main
    paths:
      - "07-document-semantic-search-sentence-bert/**"
      - "docs/07-document-semantic-search-sentence-bert/**"
      - ".github/workflows/07-document-semantic-search-sentence-bert.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-07-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-project-07:
    name: Test and validate Project 07
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 07-document-semantic-search-sentence-bert/requirements.txt

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run Python tests
        run: pytest 07-document-semantic-search-sentence-bert/tests -q

      - name: Check JavaScript syntax
        run: |
          for root in 07-document-semantic-search-sentence-bert/web docs/07-document-semantic-search-sentence-bert; do
            node --check "$root/app.js"
            node --check "$root/metrics.js"
            node --check "$root/search.js"
            node --check "$root/embeddings.js"
          done

      - name: Validate required static files and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [
              Path("07-document-semantic-search-sentence-bert/web"),
              Path("docs/07-document-semantic-search-sentence-bert"),
          ]
          required = [
              "index.html",
              "style.css",
              "app.js",
              "metrics.js",
              "search.js",
              "embeddings.js",
              "metadata.json",
              "data/corpus.json",
              "data/document_chunks.json",
              "data/embeddings.json",
              "data/evaluation_queries.json",
              "data/metadata.json",
              "data/model_metrics.json",
              "data/recall_at_k_results.json",
              "data/mrr_results.json",
              "data/query_latency_results.json",
              "data/cosine_similarity_analysis.json",
          ]

          for root in roots:
              missing = [item for item in required if not (root / item).is_file()]
              if missing:
                  raise SystemExit(f"Missing files under {root}: {missing}")

              html = (root / "index.html").read_text(encoding="utf-8")
              for marker in ("Verified evaluation results", "metric-recall", "metrics.js"):
                  if marker not in html:
                      raise SystemExit(f"Missing evaluation UI marker {marker!r} in {root / 'index.html'}")

              for path in sorted((root / "data").glob("*.json")):
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
              with (root / "metadata.json").open(encoding="utf-8") as handle:
                  json.load(handle)

          recall = json.loads((roots[0] / "data/recall_at_k_results.json").read_text())
          mrr = json.loads((roots[0] / "data/mrr_results.json").read_text())
          latency = json.loads((roots[0] / "data/query_latency_results.json").read_text())
          assert recall["status"] == "completed"
          assert mrr["status"] == "completed"
          assert latency["status"] == "completed"
          print("Required browser files, evaluation UI, and JSON artifacts are valid.")
          PY

      - name: Verify main-docs deployment mirror
        run: python 07-document-semantic-search-sentence-bert/scripts/sync_docs_site.py --check
