name: 07 Document Semantic Search Sentence BERT CI and Pages

on:
  push:
    branches: [main]
    paths:
      - "07-document-semantic-search-sentence-bert/**"
      - ".github/workflows/07-document-semantic-search-sentence-bert.yml"
  pull_request:
    branches: [main]
    paths:
      - "07-document-semantic-search-sentence-bert/**"
      - ".github/workflows/07-document-semantic-search-sentence-bert.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-project-07
  cancel-in-progress: true

env:
  PROJECT_DIR: 07-document-semantic-search-sentence-bert

jobs:
  quality:
    name: Test and validate Project 07
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Run unit tests
        run: python -m pytest "$PROJECT_DIR/tests" -q

      - name: Validate required browser files and JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("07-document-semantic-search-sentence-bert")
          required = [
              root / "web/index.html",
              root / "web/style.css",
              root / "web/app.js",
              root / "web/search.js",
              root / "web/embeddings.js",
              root / "web/data/corpus.json",
              root / "web/data/document_chunks.json",
              root / "web/data/embeddings.json",
              root / "web/data/evaluation_queries.json",
              root / "web/data/metadata.json",
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files:\n" + "\n".join(missing))

          for path in sorted((root / "web/data").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"Validated {path}")
          PY

      - name: Check JavaScript syntax
        run: |
          node --check "$PROJECT_DIR/web/app.js"
          node --check "$PROJECT_DIR/web/search.js"
          node --check "$PROJECT_DIR/web/embeddings.js"

  deploy:
    name: Deploy Project 07 to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled::Enable Pages once in Settings > Pages > Source > GitHub Actions, or run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Project 07 Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p "_site/$PROJECT_DIR"
          cp -R "$PROJECT_DIR/web/." "_site/$PROJECT_DIR/"

          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./$PROJECT_DIR/">
              <link rel="canonical" href="./$PROJECT_DIR/">
              <title>Project 07 · Document Semantic Search</title>
            </head>
            <body>
              <p><a href="./$PROJECT_DIR/">Open Project 07 — Document Semantic Search</a></p>
            </body>
          </html>
          EOF

          touch _site/.nojekyll
          test -f "_site/index.html"
          test -f "_site/$PROJECT_DIR/index.html"
          test -f "_site/$PROJECT_DIR/data/document_chunks.json"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
