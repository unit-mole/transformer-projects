name: 05 Instruction Tuned Domain LLM CI

on:
  push:
    paths:
      - "05-instruction-tuned-domain-llm/**"
      - ".github/workflows/05-instruction-tuned-domain-llm.yml"
  pull_request:
    paths:
      - "05-instruction-tuned-domain-llm/**"
      - ".github/workflows/05-instruction-tuned-domain-llm.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-instruction-tuned-domain-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 05-instruction-tuned-domain-llm/requirements-ci.txt
      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Validate dataset
        run: python scripts/prepare_dataset.py
      - name: Run tests
        run: pytest
      - name: Compile Python files
        run: python -m compileall app.py gradio_app.py src scripts tests
      - name: Import Gradio app without loading a model
        run: python -c "import app; assert app.demo is not None"
      - name: Validate inference and prompt modules
        run: python -c "from src.inference_pipeline import validate_user_prompt; from src.prompt_templates import format_prompt; assert validate_user_prompt('Explain F1')[0]; assert 'Response:' in format_prompt('Explain F1')"


  static-web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-instruction-tuned-domain-llm/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Static Space configuration
        run: npm run validate
      - name: Build Transformers.js frontend
        run: npm run build
