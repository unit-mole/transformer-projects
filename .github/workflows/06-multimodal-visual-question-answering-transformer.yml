name: 06 Multimodal Visual Question Answering Transformer CI

on:
  push:
    branches: [main]
    paths:
      - "06-multimodal-visual-question-answering-transformer/**"
      - ".github/workflows/06-multimodal-visual-question-answering-transformer.yml"
  pull_request:
    paths:
      - "06-multimodal-visual-question-answering-transformer/**"
      - ".github/workflows/06-multimodal-visual-question-answering-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-multimodal-visual-question-answering-transformer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-multimodal-visual-question-answering-transformer/requirements-ci.txt
      - name: Install lightweight CI dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Validate sample data
        run: python scripts/prepare_sample_data.py
      - name: Compile Python modules
        run: python -m compileall -q src scripts
      - name: Run tests
        run: pytest

  validate-static-space:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-multimodal-visual-question-answering-transformer
    steps:
      - uses: actions/checkout@v4
      - name: Validate required Static Space files
        shell: bash
        run: |
          set -euo pipefail
          test -f space/README.md
          test -f space/index.html
          test -f space/src/main.js
          test -f space/src/model-worker.js
          test -f space/src/style.css
          grep -q "sdk: static" space/README.md
          grep -q "app_file: index.html" space/README.md
          grep -q "Xenova/moondream2" space/src/model-worker.js
      - name: Check JavaScript syntax
        run: |
          node --check space/src/main.js
          node --check space/src/model-worker.js
      - name: Check for accidentally committed large files
        shell: bash
        run: |
          if find . -type f -size +20M -print -quit | grep -q .; then
            echo "Files larger than 20 MB are not allowed in Project 06."
            find . -type f -size +20M -print
            exit 1
          fi

  sync-static-space:
    needs: [test-python-project, validate-static-space]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        id: deployment
        shell: bash
        run: |
          if [[ -n "${HF_SPACE_REPO}" && -n "${HF_TOKEN}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN secret or HF_SPACE_REPO variable is missing; deployment is skipped."
          fi
      - name: Sync Static Space to Hugging Face
        if: steps.deployment.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" hf-space
          find hf-space -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R 06-multimodal-visual-question-answering-transformer/space/. hf-space/
          cd hf-space
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Deploy Project 06 static VQA Space from GitHub"
          git push
