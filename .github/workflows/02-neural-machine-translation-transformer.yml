name: 02 Neural Machine Translation Transformer CI

on:
  push:
    paths:
      - "02-neural-machine-translation-transformer/**"
      - ".github/workflows/02-neural-machine-translation-transformer.yml"
  pull_request:
    paths:
      - "02-neural-machine-translation-transformer/**"
      - ".github/workflows/02-neural-machine-translation-transformer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 02-neural-machine-translation-transformer

    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            02-neural-machine-translation-transformer/requirements.txt
            02-neural-machine-translation-transformer/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q -m "not integration"

      - name: Validate inference pipeline import
        run: |
          python -c "from src.translation_pipeline import TranslationPipeline; print('translation pipeline import: OK')"

      - name: Validate Gradio app import without downloading models
        run: |
          python -c "import app; assert app.demo is not None; print('Gradio app import: OK')"

      - name: Compile Python files
        run: python -m compileall app.py gradio_app.py src scripts
