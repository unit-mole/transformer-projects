name: 02 Neural Machine Translation Transformer CI

on:
  workflow_dispatch:
  push:
    paths:
      - "02-neural-machine-translation-transformer/**"
      - ".github/workflows/02-neural-machine-translation-transformer.yml"
  pull_request:
    paths:
      - "02-neural-machine-translation-transformer/**"
      - ".github/workflows/02-neural-machine-translation-transformer.yml"

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 02-neural-machine-translation-transformer
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: 02-neural-machine-translation-transformer/requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip check

      - name: Run Python unit tests
        run: pytest -q -m "not integration"

      - name: Validate Python imports
        run: |
          python -c "from src.translation_pipeline import TranslationPipeline; print('translation pipeline import: OK')"
          python -c "import app; assert app.demo is not None; print('local Gradio app import: OK')"

      - name: Compile Python files
        run: python -m compileall -q app.py gradio_app.py src scripts

  static-web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 02-neural-machine-translation-transformer/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Static Space JavaScript
        run: npm run validate

      - name: Validate Static Space files
        run: |
          test -f README.md
          test -f index.html
          test -f src/translation.worker.js
          grep -q "sdk: static" README.md
          grep -q "app_file: index.html" README.md
          grep -q "@huggingface/transformers@3.8.1" src/translation.worker.js
