name: 08 Image Classification Vision Transformer CI

on:
  push:
    branches:
      - main
    paths:
      - "08-image-classification-vision-transformer/**"
      - "docs/08-image-classification-vision-transformer/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"

  pull_request:
    branches:
      - main
    paths:
      - "08-image-classification-vision-transformer/**"
      - "docs/08-image-classification-vision-transformer/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: 08-image-classification-vision-transformer
  DEPLOY_DIR: docs/08-image-classification-vision-transformer

jobs:
  validate:
    name: Validate Project 08 source and docs deployment copy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate source web application files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/web/index.html"
          test -f "$PROJECT_DIR/web/style.css"
          test -f "$PROJECT_DIR/web/app.js"

      - name: Validate docs deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEPLOY_DIR/index.html"
          test -f "$DEPLOY_DIR/style.css"
          test -f "$DEPLOY_DIR/app.js"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find "$PROJECT_DIR/web" "$DEPLOY_DIR" -type f -name '*.js' -print0)

      - name: Validate JSON assets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [
              Path("08-image-classification-vision-transformer/web"),
              Path("docs/08-image-classification-vision-transformer"),
          ]

          for root in roots:
              if not root.exists():
                  raise FileNotFoundError(f"Missing required directory: {root}")

              for path in sorted(root.rglob("*.json")):
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
                  print(f"Validated {path}")
          PY

      - name: Confirm workflow is validation-only
        shell: bash
        run: |
          set -euo pipefail
          echo "Project 08 is published by GitHub Pages from main/docs."
          echo "This workflow validates files only and does not deploy Pages."
