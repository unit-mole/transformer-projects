name: 08 Image Classification Vision Transformer CI

# This workflow is intentionally restricted to Project 08. A Project 09-only
# commit must not start this workflow.
on:
  push:
    branches:
      - main
    paths:
      - "08-image-classification-vision-transformer/**"
      - "docs/08-image-classification-vision-transformer/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"
  pull_request:
    branches:
      - main
    paths:
      - "08-image-classification-vision-transformer/**"
      - "docs/08-image-classification-vision-transformer/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project-08:
    name: Validate Project 08 only
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Project 08 source folder
        shell: bash
        run: |
          set -euo pipefail
          project="08-image-classification-vision-transformer"
          test -d "$project"

          # Some portfolio versions keep the static app in web/, while earlier
          # versions keep development files elsewhere. Validate web/ only when it
          # exists instead of failing unrelated commits.
          if [[ -d "$project/web" ]]; then
            test -f "$project/web/index.html"
            test -f "$project/web/style.css"
            test -f "$project/web/app.js"
            echo "Project 08 source web application found and validated."
          else
            echo "Project 08 has no web/ directory; docs deployment copy is authoritative."
          fi

      - name: Validate Project 08 docs deployment files
        shell: bash
        run: |
          set -euo pipefail
          deploy="docs/08-image-classification-vision-transformer"
          test -d "$deploy"
          test -f "$deploy/index.html"
          test -f "$deploy/style.css"
          test -f "$deploy/app.js"
          test -d "$deploy/model"
          test -d "$deploy/sample_images"
          echo "Project 08 docs deployment copy validated."

      - name: Check Project 08 JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          deploy="docs/08-image-classification-vision-transformer"
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find "$deploy" -maxdepth 1 -type f -name "*.js" -print0)

      - name: Validate Project 08 JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/08-image-classification-vision-transformer")
          files = sorted(root.glob("*.json"))
          if not files:
              raise SystemExit("No Project 08 JSON files were found in docs.")
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"Validated {path}")
          PY

      - name: Confirm workflow is validation-only
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/08-image-classification-vision-transformer.yml"
          if grep -Eiq 'actions/(configure-pages|deploy-pages)|gh-pages|PAGES_DEPLOY_TOKEN|pages:[[:space:]]*write|id-token:[[:space:]]*write' "$workflow"; then
            echo "Project 08 workflow contains a deployment action or deployment permission."
            exit 1
          fi
          echo "Project 08 workflow is validation-only."
