name: 08 Image Classification Vision Transformer CI

on:
  push:
    branches: [main]
    paths:
      - "08-image-classification-vision-transformer/**"
      - "docs/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"
  pull_request:
    paths:
      - "08-image-classification-vision-transformer/**"
      - "docs/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-08-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Project 08 and Pages Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 08-image-classification-vision-transformer/requirements.txt

      - name: Install lightweight requirements
        working-directory: 08-image-classification-vision-transformer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate project browser application
        run: |
          test -f 08-image-classification-vision-transformer/web/index.html
          test -f 08-image-classification-vision-transformer/web/style.css
          test -f 08-image-classification-vision-transformer/web/app.js
          test -f 08-image-classification-vision-transformer/web/inference.js
          test -f 08-image-classification-vision-transformer/web/image_preprocessing.js
          test -f 08-image-classification-vision-transformer/web/attention.js
          test -f 08-image-classification-vision-transformer/web/metadata.json
          test -f 08-image-classification-vision-transformer/web/class_names.json
          python -m json.tool 08-image-classification-vision-transformer/web/metadata.json > /dev/null
          python -m json.tool 08-image-classification-vision-transformer/web/class_names.json > /dev/null

      - name: Validate GitHub Pages publishing folder
        run: |
          test -f docs/.nojekyll
          test -f docs/index.html
          test -f docs/08-image-classification-vision-transformer/index.html
          test -f docs/08-image-classification-vision-transformer/style.css
          test -f docs/08-image-classification-vision-transformer/app.js
          test -f docs/08-image-classification-vision-transformer/inference.js
          test -f docs/08-image-classification-vision-transformer/image_preprocessing.js
          test -f docs/08-image-classification-vision-transformer/attention.js
          test -f docs/08-image-classification-vision-transformer/metadata.json
          test -f docs/08-image-classification-vision-transformer/class_names.json
          python -m json.tool docs/08-image-classification-vision-transformer/metadata.json > /dev/null
          python -m json.tool docs/08-image-classification-vision-transformer/class_names.json > /dev/null

      - name: Check deployed copy matches project web folder
        run: |
          diff -qr \
            --exclude=.nojekyll \
            08-image-classification-vision-transformer/web \
            docs/08-image-classification-vision-transformer

      - name: Validate Python modules
        working-directory: 08-image-classification-vision-transformer
        run: python -m compileall -q src scripts

      - name: Run tests
        working-directory: 08-image-classification-vision-transformer
        run: python -m pytest -q
