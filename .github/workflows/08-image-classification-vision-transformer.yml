name: 08 Image Classification Vision Transformer CI and Pages

on:
  push:
    branches: [main]
    paths:
      - "08-image-classification-vision-transformer/**"
      - "pages/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"
  pull_request:
    paths:
      - "08-image-classification-vision-transformer/**"
      - "pages/**"
      - ".github/workflows/08-image-classification-vision-transformer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-image-classification-vision-transformer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 08-image-classification-vision-transformer/requirements.txt

      - name: Install lightweight project requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate required static files
        run: |
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f web/inference.js
          test -f web/image_preprocessing.js
          test -f web/attention.js
          test -f web/metadata.json
          test -f web/class_names.json
          test -f data/class_names.json
          python -m json.tool web/metadata.json >/dev/null
          python -m json.tool web/class_names.json >/dev/null

      - name: Validate Python imports
        run: python -m compileall -q src scripts

      - name: Run tests
        run: python -m pytest -q

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static Pages artifact
        run: |
          mkdir -p _site/08-image-classification-vision-transformer
          cp -R pages/. _site/
          cp -R 08-image-classification-vision-transformer/web/. _site/08-image-classification-vision-transformer/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
