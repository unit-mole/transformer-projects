name: 04 Long Document Question Answering Longformer CI

on:
  push:
    paths:
      - "04-long-document-question-answering-longformer/**"
      - ".github/workflows/04-long-document-question-answering-longformer.yml"
  pull_request:
    paths:
      - "04-long-document-question-answering-longformer/**"
      - ".github/workflows/04-long-document-question-answering-longformer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LONGDOCQA_SKIP_MODEL_LOAD: "1"
      TOKENIZERS_PARALLELISM: "false"
    defaults:
      run:
        working-directory: 04-long-document-question-answering-longformer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            04-long-document-question-answering-longformer/requirements.txt
            04-long-document-question-answering-longformer/requirements-dev.txt
            04-long-document-question-answering-longformer/requirements-evaluation.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: python -m compileall app.py gradio_app.py src scripts tests
      - run: pytest

  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 04-long-document-question-answering-longformer/hf-space-ready
    steps:
      - uses: actions/checkout@v4
      - name: Validate prebuilt Static Space files
        run: |
          test -f README.md
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f samples/index.json
          grep -q "sdk: static" README.md
          grep -q "app_file: index.html" README.md
          if grep -q "app_build_command" README.md; then
            echo "Prebuilt Space must not contain app_build_command"
            exit 1
          fi

  deploy-static-space:
    name: Deploy credit-free Static Space
    needs: [python-validation, browser-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade huggingface_hub
      - name: Upload prebuilt website to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_PROJECT04 }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("Missing GitHub secret HF_TOKEN_PROJECT04")

          HfApi(token=token).upload_folder(
              folder_path="04-long-document-question-answering-longformer/hf-space-ready",
              repo_id="anmol-unitmole/long-document-question-answering-longformer",
              repo_type="space",
              delete_patterns="*",
              commit_message="Deploy final credit-free Project 04 Static Space",
          )
          PY
