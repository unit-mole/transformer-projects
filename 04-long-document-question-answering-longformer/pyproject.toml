[project]
name = "long-document-question-answering-longformer"
version = "1.0.0"
description = "Portfolio-ready Longformer extractive QA with evidence highlighting."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
