name: 10 AI Portfolio RAG Assistant Standalone CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate required application files
        shell: bash
        run: |
          test -f app/page.tsx
          test -f app/api/chat/route.ts
          test -f app/api/retrieve/route.ts
          test -f app/api/health/route.ts
          test -f public/data/document_chunks.json
          test -f public/data/embeddings.json
          test -f public/data/metadata.json
          test -f public/data/evaluation_questions.json
          test -f public/data/evaluation_summary.json
          test -f notebooks/01-build-and-evaluate-transformer-rag.ipynb

      - name: Install Node.js dependencies
        run: npm install

      - name: Install lightweight Python test dependencies
        run: python -m pip install --upgrade pip pytest numpy scikit-learn beautifulsoup4 requests

      - name: Validate static vector artifacts
        run: npm run validate:data

      - name: Run Node.js tests
        run: npm test

      - name: Run Python unit tests
        run: python -m pytest -q

      - name: Type-check Next.js application
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build
