project:
  number: "03"
  name: "03-cross-encoder-bi-encoder-ranking-system"
  display_name: "DocRank360 — Two-Stage Transformer Search Ranking"

models:
  bi_encoder: "sentence-transformers/all-MiniLM-L6-v2"
  cross_encoder: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  browser_bi_encoder: "Xenova/all-MiniLM-L6-v2"
  browser_cross_encoder: "Xenova/ms-marco-MiniLM-L-6-v2"
  device: "cpu"

retrieval:
  default_candidate_k: 10
  maximum_candidate_k: 20
  default_rerank_k: 5
  similarity_metric: "cosine"
  index_backend: "numpy"
  normalize_embeddings: true

data:
  documents_path: "data/sample_documents.csv"
  queries_path: "data/sample_queries.csv"
  qrels_path: "data/sample_qrels.csv"
  minimum_query_characters: 3
  minimum_document_characters: 20

deployment:
  github:
    purpose: "Complete Python ML engineering project"
  model_hub:
    purpose: "Pipeline model card, configuration, evaluation and limitations"
    default_repository: "anmol-unitmole/docrank360-ranking-pipeline-card"
    contains_trained_weights: false
  static_space:
    platform: "Hugging Face Static Spaces"
    sdk: "static"
    app_file: "index.html"
    source_directory: "web"
    build_directory: "web/dist"
    inference_runtime: "Transformers.js + ONNX Runtime Web"
    dtype: "q8"
    paid_compute_required: false
  gradio:
    purpose: "Local Python comparison and optional compute-backed deployment"
    app_file: "app.py"
    primary_deployment: false
