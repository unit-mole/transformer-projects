experiment:
  name: project-05-portfolio-scale-lora
  run_id: null
  full_determinism: false

model:
  # Keep FLAN-T5-small as the primary model because it can be converted to a
  # practical quantized ONNX browser model after LoRA training.
  base_model_id: google/flan-t5-small

data:
  dataset_path: data/ml_ds_instruction_dataset_extended.jsonl
  evaluation_path: data/evaluation_prompts_extended.jsonl
  max_source_length: 384
  max_target_length: 192

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q
    - v

training:
  output_dir: models/experiments
  learning_rate: 0.0003
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  train_batch_size: 4
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  epochs: 10
  early_stopping_patience: 2
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 5
  save_total_limit: 2
  precision: auto
  gradient_checkpointing: false
  dataloader_num_workers: 0
  optim: adamw_torch
  seed: 42

evaluation:
  output_dir: outputs/portfolio_experiment
  max_source_length: 384
  max_target_length: 192
  max_new_tokens: 192
  num_beams: 4
  repetition_penalty: 1.05
  batch_size_loss: 8
  bertscore_model_type: distilbert-base-uncased
  embedding_model_id: sentence-transformers/all-MiniLM-L6-v2
  bootstrap_samples: 5000
  confidence_level: 0.95
  low_reference_support_threshold: 0.42
