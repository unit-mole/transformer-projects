model:
  base_model_id: google/flan-t5-small

data:
  dataset_path: data/ml_ds_instruction_dataset.jsonl
  max_source_length: 384
  max_target_length: 192

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q
    - v

training:
  output_dir: models/lora_adapter
  learning_rate: 0.0002
  train_batch_size: 4
  eval_batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 3
  weight_decay: 0.01
  logging_steps: 10
  seed: 42
  fp16: false
