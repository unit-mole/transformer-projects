[project]
name = "instruction-tuned-domain-llm"
version = "0.1.0"
description = "FLAN-T5 LoRA/PEFT ML and Data Science learning assistant"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
