<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Project 05 browser deployment architecture</title>
<desc id="desc">Custom instruction data is used for LoRA training, the adapter is merged into FLAN-T5, exported to ONNX, and loaded by Transformers.js in a browser.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="#08111f"/>
<g font-family="Inter,Segoe UI,sans-serif" fill="#e8eef9" text-anchor="middle">
  <g filter="url(#s)">
    <rect x="45" y="115" width="190" height="150" rx="22" fill="#121f37" stroke="#334155"/>
    <rect x="285" y="115" width="190" height="150" rx="22" fill="#121f37" stroke="#334155"/>
    <rect x="525" y="115" width="190" height="150" rx="22" fill="#121f37" stroke="#334155"/>
    <rect x="765" y="115" width="190" height="150" rx="22" fill="#121f37" stroke="#334155"/>
    <rect x="1005" y="115" width="150" height="150" rx="22" fill="url(#g)"/>
  </g>
  <g font-size="18" font-weight="700">
    <text x="140" y="165">Custom ML/DS</text><text x="140" y="190">instruction data</text>
    <text x="380" y="165">FLAN-T5 +</text><text x="380" y="190">LoRA / PEFT</text>
    <text x="620" y="165">Merged</text><text x="620" y="190">checkpoint</text>
    <text x="860" y="165">Quantized</text><text x="860" y="190">ONNX model</text>
    <text x="1080" y="165">Browser</text><text x="1080" y="190">inference</text>
  </g>
  <g font-size="13" fill="#a9b7cc">
    <text x="140" y="225">curated + validated</text>
    <text x="380" y="225">parameter-efficient training</text>
    <text x="620" y="225">adapter merged once</text>
    <text x="860" y="225">Hub model repository</text>
    <text x="1080" y="225" fill="#07101f">Transformers.js</text>
  </g>
  <g stroke="#67e8f9" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M245 190h28"/><path d="m267 180 12 10-12 10"/>
    <path d="M485 190h28"/><path d="m507 180 12 10-12 10"/>
    <path d="M725 190h28"/><path d="m747 180 12 10-12 10"/>
    <path d="M965 190h28"/><path d="m987 180 12 10-12 10"/>
  </g>
  <text x="600" y="55" font-size="25" font-weight="800">Instruction-Tuned Domain LLM: Training to Static Browser Deployment</text>
  <text x="600" y="355" font-size="15" fill="#a9b7cc">Python training and evaluation remain in GitHub; the live Static Space performs real client-side Transformer inference.</text>
</g>
</svg>
